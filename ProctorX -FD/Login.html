<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    
    <form id="loginForm" class="login-container">
        <h1>Login</h1><br>
        
       
        Enter your Gmail:<input type="email" id="email" placeholder="Enter Email" required><br><br>
        
       
        Enter your password:<input type="password" id="password" placeholder="Enter Password" required><br><br>
        
        <button type="submit" id="loginBtn">Login</button>
        
        <br><br>
        <div id="messageBox"></div>
    </form>
    
    <script src="login.js" defer></script>
</body>
</html>
